<script>
  const products = {
    suit: { title: 'เสื้อสูท FZRM', desc: 'สูทสไตล์ทันสมัย ตัดเย็บด้วยผ้าคุณภาพสูง เหมาะสำหรับทุกโอกาส', img: document.getElementById('img-suit').src },
    tshirt: { title: 'เสื้อยืด FZRM', desc: 'เสื้อยืดคอตตอน 100% นุ่มใส่สบาย ดีไซน์เรียบหรู ใส่ได้ทุกวัน', img: document.getElementById('img-tshirt').src },
    hoodie: { title: 'เสื้อฮู้ด FZRM', desc: 'ฮู้ดดี้โอเวอร์ไซส์ ผ้าฟลีซอุ่น นุ่ม ใส่สบายทั้งวัน สไตล์ Street', img: document.getElementById('img-hoodie').src }
  };
  function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
  function closeMenu() {
    document.getElementById('sideMenu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
  function openLightbox(key) {
    const p = products[key];
    document.getElementById('lbImg').src = p.img;
    document.getElementById('lbTitle').textContent = p.title;
    document.getElementById('lbDesc').textContent = p.desc;
    document.getElementById('lightbox').classList.add('show');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('show');
  }
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeLightbox(); closeMenu(); }
  });
</script>
